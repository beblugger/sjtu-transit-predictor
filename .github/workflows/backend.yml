name: Update satellite backend

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

concurrency:
  group: satellite-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      TRANSIT_EPHEMERIS_PATH: /home/runner/.cache/sjtu-transit/de421.bsp
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Restore calculation cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .state/transit.db
            /home/runner/.cache/sjtu-transit/de421.bsp
          key: backend-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: backend-v1-${{ runner.os }}-
      - name: Recover latest durable inputs and request cooldowns
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin state; then
            git fetch --depth=1 origin state
            git show FETCH_HEAD:inputs.db.gz > "$RUNNER_TEMP/inputs.db.gz"
            python scripts/deployment_state.py merge --snapshot "$RUNNER_TEMP/inputs.db.gz"
          fi
      - name: Install and verify JPL ephemeris
        shell: bash
        run: |
          mkdir -p "$(dirname "$TRANSIT_EPHEMERIS_PATH")"
          if [[ ! -f "$TRANSIT_EPHEMERIS_PATH" ]]; then
            curl --fail --location --retry 3 --max-time 180 \
              https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp \
              --output "$TRANSIT_EPHEMERIS_PATH"
          fi
          echo "a20a7139da04cbc462454634918e9a9ca69127044e2cc9d4f9c16e238d2deedc  $TRANSIT_EPHEMERIS_PATH" | sha256sum --check
      - name: Test backend
        run: python -m pytest -q
      - name: Test frontend data handling
        run: node --test tests/*.test.mjs
      - name: Compute next 96 hours
        run: python -m app.export --database .state/transit.db --output dist/data --hours 96
      - name: Save durable inputs (including failed request attempts)
        if: ${{ !cancelled() && hashFiles('.state/transit.db') != '' }}
        shell: bash
        run: |
          snapshot_dir="$RUNNER_TEMP/backend-state"
          mkdir -p "$snapshot_dir"
          python scripts/deployment_state.py pack --snapshot "$snapshot_dir/inputs.db.gz"
          if [[ -f dist/data/manifest.json ]]; then
            cp dist/data/manifest.json "$snapshot_dir/manifest.json"
          fi
          # A dedicated root commit keeps only the latest snapshot reachable.
          # It never rewrites main or accumulates a history of binary databases.
          previous_sha="$(git ls-remote --heads origin state | cut -f1)"
          git -C "$snapshot_dir" init --initial-branch=state
          git -C "$snapshot_dir" config user.name 'github-actions[bot]'
          git -C "$snapshot_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$snapshot_dir" add .
          git -C "$snapshot_dir" commit -m 'Update orbit and weather snapshot'
          state_sha="$(git -C "$snapshot_dir" rev-parse HEAD)"
          git fetch "$snapshot_dir" state
          git push --force-with-lease="refs/heads/state:$previous_sha" origin "$state_sha:refs/heads/state"
      - name: Independently validate published geometry
        run: python scripts/validate_export.py --data dist/data
      - name: Prepare static data site
        run: |
          python scripts/build_frontend.py --source deploy --data dist/data --output dist
          cp DESIGN.md dist/design.md
          cp THIRD_PARTY_NOTICES.md dist/third-party.md
          cp -R licenses dist/licenses
          touch dist/.nojekyll
      - name: Save calculation cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .state/transit.db
            /home/runner/.cache/sjtu-transit/de421.bsp
          key: backend-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload complete static snapshot
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy backend data
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
