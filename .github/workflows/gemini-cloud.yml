name: Geminids cloud chart

on:
  workflow_dispatch:
    inputs:
      date:
        description: '观测夜起始日期（Asia/Shanghai，本地时间）'
        type: string
        default: '2026-12-12'
      label:
        description: '图上角标（留空则不显示）'
        type: string
        default: ''
  pull_request:
    paths:
      - 'app/geminids_cloud.py'
      - 'tests/test_geminids_cloud.py'
      - '.github/workflows/gemini-cloud.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_DATE: ${{ inputs.date || '2026-12-12' }}
      TARGET_LABEL: ${{ inputs.label || '' }}
      # 固定到 notofonts/noto-cjk 的提交，避免字体悄悄变样
      FONT_SHA: f8d157532fbfaeda587e826d4cd5b21a49186f7c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install chart dependencies
        run: python -m pip install -e '.[dev,chart]'
      - name: Test cloud chart
        run: python -m pytest -q tests/test_geminids_cloud.py
      - name: Fetch CJK fonts
        shell: bash
        run: |
          font_dir="$RUNNER_TEMP/fonts"
          mkdir -p "$font_dir"
          base="https://raw.githubusercontent.com/notofonts/noto-cjk/${FONT_SHA}/Sans/SubsetOTF/SC"
          for weight in Light Regular Bold; do
            curl --fail --location --retry 3 --max-time 180 \
              "$base/NotoSansSC-$weight.otf" \
              --output "$font_dir/NotoSansSC-$weight.otf"
            test -s "$font_dir/NotoSansSC-$weight.otf"
          done
          echo "FONT_DIR=$font_dir" >> "$GITHUB_ENV"
      - name: Render cloud chart
        run: |
          python -m app.geminids_cloud \
            --date "$TARGET_DATE" \
            --label "$TARGET_LABEL" \
            --font-dir "$FONT_DIR" \
            --out "charts/$TARGET_DATE"
      - name: Upload chart
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geminids-cloud-${{ env.TARGET_DATE }}
          path: charts
          retention-days: 30
          if-no-files-found: error
