[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sjtu-transit-predictor"
version = "0.1.0"
description = "Static satellite Sun/Moon transit predictor for SJTU Minhang campus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "shapely>=2.1,<3",
  "skyfield>=1.49,<2",
  "sgp4>=2.23,<3",
  "PyYAML>=5.4,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
transit-export = "app.export:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
